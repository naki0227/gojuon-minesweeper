name: Deploy Supabase

# Manual only. Applies DB migrations, then deploys the online-game Edge
# Function, in that order. Ship the app (TestFlight) after this succeeds.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list pending migrations; change nothing"
        type: boolean
        default: true

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check secrets
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set in the production environment."
              exit 1
            fi
          done

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Pending migrations
        run: supabase db push --dry-run

      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        run: supabase db push

      - name: Copy game rules for the Edge Function
        if: ${{ !inputs.dry_run }}
        run: npm run online:sync

      - name: Deploy Edge Function
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy online-game --project-ref "$SUPABASE_PROJECT_ID"
