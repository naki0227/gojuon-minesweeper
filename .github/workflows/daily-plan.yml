name: Daily Plan

# Every Wednesday, adds the next 7 days of 今日の一問 to
# src/daily/schedule.upcoming.enc and opens a PR, so the schedule never
# runs out. Skipped while the schedule already reaches 10 days ahead.
# The repository is public, so the coming days are encrypted with the
# DAILY_SCHEDULE_KEY secret and this log shows dates only. The PR has no
# trivia; add it with `npm run daily:schedule -- open` / `close` if wanted.
#
# Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Settings → Actions → General.
on:
  schedule:
    - cron: "17 0 * * 3" # Wednesday 9:17 Japan time
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # To start CI on the PR branch (see the last step).
  actions: write

concurrency:
  group: daily-plan
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DAILY_SCHEDULE_KEY: ${{ secrets.DAILY_SCHEDULE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Check how far the schedule reaches
        id: reach
        run: |
          last=$(npm run -s daily:schedule -- last)
          limit=$(TZ=Asia/Tokyo date -d '+10 days' +%F)
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if [[ "$last" > "$limit" || "$last" == "$limit" ]]; then
            echo "Schedule reaches $last; nothing to add."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add the next 7 days
        if: steps.reach.outputs.needed == 'true'
        run: |
          npm run -s daily:plan -- 7 | tee "$RUNNER_TEMP/planned.txt"
          npm test -- tests/daily.test.ts

      - name: Open a PR
        if: steps.reach.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          first=$(head -n 1 "$RUNNER_TEMP/planned.txt")
          last=$(tail -n 1 "$RUNNER_TEMP/planned.txt")
          branch="daily-plan/$first"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/daily/schedule.upcoming.enc
          git commit -m "Plan 今日の一問 for $first to $last"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Plan 今日の一問 for $first to $last" \
            --body "Adds the next 7 days of 今日の一問 (encrypted), picked by \`scripts/daily/plan.ts\` and checked by \`tests/daily.test.ts\`. Trivia is empty; add it with \`npm run daily:schedule -- open\` and \`close\` (needs DAILY_SCHEDULE_KEY) before merging if wanted."
          # The PR above comes from GITHUB_TOKEN, which starts no
          # pull_request run, so the required "validate" check would never
          # report. A dispatch is the one event it may start.
          gh workflow run ci.yml --ref "$branch"
