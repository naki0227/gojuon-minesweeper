name: Format endless draft (temporary)

on:
  push:
    branches:
      - feat/endless-solo-20261012

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply Prettier to draft files
        run: npx prettier --write app/endless.tsx src/endless/*.ts src/endless/*.tsx src/components/BoardTile.tsx src/components/CharacterBoard.tsx src/components/HomeSetup.tsx tests/endless.test.ts
      - name: Commit formatting
        run: |
          git add app/endless.tsx src/endless src/components/BoardTile.tsx src/components/CharacterBoard.tsx src/components/HomeSetup.tsx tests/endless.test.ts
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -c core.hooksPath=/dev/null commit -m "style: format endless draft with Prettier"
            git push
          fi
