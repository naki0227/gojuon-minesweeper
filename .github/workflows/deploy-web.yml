name: Deploy Web

on:
  push:
    branches: ["main"]
  # 7:00 Japan time (22:00 UTC): put the new day of 今日の一問 online.
  # GitHub starts scheduled runs late, sometimes by hours (worst on the
  # hour), never early, so the database starts it on time instead (pg_cron
  # at 7:01 and 7:20 with only_if_missing, see
  # supabase/migrations/20261017000000_daily_deploy_cron.sql). These
  # schedules are the fallback; once the day is online, later tries stop
  # after a quick check.
  schedule:
    - cron: "2 22 * * *"
    - cron: "17 22 * * *"
    - cron: "37 22 * * *"
    - cron: "7 23 * * *"
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      only_if_missing:
        description: "Skip if today's puzzle is already online"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-web
  # A push cancels an older run. Scheduled and dispatched tries wait
  # instead, so a late try never cuts off the one that is publishing.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Daily tries after the first successful one have nothing to do.
  check:
    runs-on: ubuntu-latest
    outputs:
      online: ${{ steps.today.outputs.online }}
    steps:
      - name: Is today's puzzle already online?
        id: today
        if: github.event_name == 'schedule' || inputs.only_if_missing
        run: |
          today=$(TZ=Asia/Tokyo date -d '-7 hours' +%F)
          # A missing file falls back to the app page (200 text/html), so
          # only a JSON answer counts.
          type=$(curl -s -o /dev/null -w '%{content_type}' "https://minesweeper.enludus.com/daily/$today/puzzle.json" || true)
          if [[ "$type" == application/json* ]]; then
            echo "$today is already online."
            echo "online=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.online != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm install

      - name: Validate question bank
        run: npm run validate:questions

      - name: Typecheck
        run: npm run typecheck

      - name: Export web
        run: npm run build:web
        env:
          # Set these as repository variables (Settings > Secrets and variables > Actions > Variables).
          EXPO_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_CLIENT_ID }}
          EXPO_PUBLIC_ADSENSE_SETUP_SLOT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_SETUP_SLOT_ID }}
          EXPO_PUBLIC_ADSENSE_RESULT_SLOT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_RESULT_SLOT_ID }}
          # Used only to write app-ads.txt for AdMob app verification.
          ADMOB_IOS_APP_ID: ${{ vars.ADMOB_IOS_APP_ID }}
          ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
          # Online play. Without these the online button stays hidden.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}

      # The same app in English at /en/ (functions/index.ts sends browsers
      # that prefer another language there). Public files such as the
      # Cloudflare headers live at the root only.
      - name: Export English web
        run: |
          npx expo export -p web --output-dir dist-en
          node scripts/move-vendor-assets.mjs dist-en
          rm -rf dist-en/_headers dist-en/_redirects dist-en/.well-known \
            dist-en/robots.txt dist-en/sitemap.xml
          mkdir -p dist/en
          cp -R dist-en/. dist/en/
        env:
          EXPO_PUBLIC_LOCALE: en
          EXPO_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_CLIENT_ID }}
          EXPO_PUBLIC_ADSENSE_SETUP_SLOT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_SETUP_SLOT_ID }}
          EXPO_PUBLIC_ADSENSE_RESULT_SLOT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_RESULT_SLOT_ID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}

      # Chrome comes with the runner; Japanese fonts and ffmpeg (for the
      # 今日の一問 videos) are installed here.
      - name: Install Japanese fonts and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg

      # Only days up to today (Japan time) go online.
      - name: Publish 今日の一問
        run: npm run daily:publish -- dist/daily
        env:
          # Decrypts the coming days (src/daily/schedule.upcoming.enc).
          DAILY_SCHEDULE_KEY: ${{ secrets.DAILY_SCHEDULE_KEY }}
          # The プレゼント box calls the daily-lottery Edge Function.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}

      # Cloudflare Pages serves minesweeper.enludus.com (custom headers in
      # public/_headers; the functions/ folder next to dist is deployed as
      # Pages Functions). Needs the CLOUDFLARE_API_TOKEN and
      # CLOUDFLARE_ACCOUNT_ID repository secrets.
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name gojuon-minesweeper --branch main --commit-dirty=true
