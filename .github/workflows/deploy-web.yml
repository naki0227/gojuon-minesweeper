name: Deploy Web

on:
  push:
    branches: ["main"]
  # 00:05 Japan time: render the images for the coming days of 今日の一問.
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate question bank
        run: npm run validate:questions

      - name: Typecheck
        run: npm run typecheck

      - name: Export web
        run: npm run build:web
        env:
          # Set these as repository variables (Settings > Secrets and variables > Actions > Variables).
          EXPO_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_CLIENT_ID }}
          EXPO_PUBLIC_ADSENSE_SETUP_SLOT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_SETUP_SLOT_ID }}
          EXPO_PUBLIC_ADSENSE_RESULT_SLOT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_RESULT_SLOT_ID }}
          # Used only to write app-ads.txt for AdMob app verification.
          ADMOB_IOS_APP_ID: ${{ vars.ADMOB_IOS_APP_ID }}
          ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
          # Online play. Without these the online button stays hidden.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}

      # Chrome comes with the runner; Japanese fonts do not.
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Render 今日の一問 images
        run: npm run daily:render -- dist/daily 100000 7

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
