name: Deploy Web

on:
  push:
    branches: ["main"]
  # 7:00 Japan time (22:00 UTC): put the new day of 今日の一問 online.
  # Scheduled runs can start a few minutes late, never early.
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate question bank
        run: npm run validate:questions

      - name: Typecheck
        run: npm run typecheck

      - name: Export web
        run: npm run build:web
        env:
          # Set these as repository variables (Settings > Secrets and variables > Actions > Variables).
          EXPO_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_CLIENT_ID }}
          EXPO_PUBLIC_ADSENSE_SETUP_SLOT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_SETUP_SLOT_ID }}
          EXPO_PUBLIC_ADSENSE_RESULT_SLOT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_RESULT_SLOT_ID }}
          # Used only to write app-ads.txt for AdMob app verification.
          ADMOB_IOS_APP_ID: ${{ vars.ADMOB_IOS_APP_ID }}
          ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
          # Online play. Without these the online button stays hidden.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}

      # Chrome comes with the runner; Japanese fonts do not.
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      # Only days up to today (Japan time) go online.
      - name: Publish 今日の一問
        run: npm run daily:publish -- dist/daily

      # Cloudflare Pages (free for commercial use, custom headers, preview
      # URLs). Runs once CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are
      # set as repository secrets; GitHub Pages keeps serving the site until
      # the domain moves over, then the step below is removed.
      - name: Check for Cloudflare credentials
        id: cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "enabled=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish to Cloudflare Pages
        if: steps.cloudflare.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create gojuon-minesweeper --production-branch main || true
          npx --yes wrangler@4 pages deploy dist --project-name gojuon-minesweeper --branch main --commit-dirty=true

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
